  <rect x="415" y="225" width="210" height="48" class="box"/><text x="520" y="255" text-anchor="middle" class="boxText">EnrollmentCommandService</text>
  <rect x="415" y="295" width="210" height="48" class="box"/><text x="520" y="325" text-anchor="middle" class="boxText">EnrollmentEligibilityPolicy</text>
