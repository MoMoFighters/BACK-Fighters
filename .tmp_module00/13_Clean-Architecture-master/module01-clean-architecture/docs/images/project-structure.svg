  <rect x="90" y="395" width="210" height="48" class="box"/><text x="195" y="425" text-anchor="middle" class="boxText">CourseRepositoryAdapter</text>

  <rect x="380" y="90" width="280" height="470" class="group"/>
  <text x="520" y="122" text-anchor="middle" class="ctx">Enrollment</text>
