<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" role="img" aria-labelledby="title desc">
  <title id="title">Project Structure Overview</title>
  <desc id="desc">Catalog, Enrollment, and Learning contexts with presentation, application, domain, and infrastructure elements.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .ctx { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 600 14px Arial, sans-serif; fill: #111827; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; rx: 9; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.8; rx: 18; }
      .arrow { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .todo { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1040" height="660" fill="#ffffff"/>
  <text x="520" y="42" text-anchor="middle" class="title">Project Structure Overview</text>

