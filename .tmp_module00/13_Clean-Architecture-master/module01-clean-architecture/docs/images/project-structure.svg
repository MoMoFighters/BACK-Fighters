  <text x="845" y="122" text-anchor="middle" class="ctx">Learning</text>
  <rect x="740" y="155" width="210" height="48" class="box"/><text x="845" y="185" text-anchor="middle" class="boxText">LearningController</text>
  <rect x="740" y="235" width="210" height="48" class="box"/><text x="845" y="265" text-anchor="middle" class="boxText">LearningCommandService</text>
