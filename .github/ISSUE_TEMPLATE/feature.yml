name: 🚀 Feature Request
description: 새로운 기능 개발 요청 (BE)
title: "[FEAT] "
labels: ["feature", "backend"]
body:
  - type: markdown
    attributes:
      value: |
        ## 새로운 기능을 제안합니다
        BE 팀의 새로운 기능 개발을 위한 템플릿입니다.

  - type: textarea
    id: description
    attributes:
      label: 기능 설명
      description: 어떤 기능인지 간단하게 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목 (To-do)
      value: |
        - [ ] 작업 1
        - [ ] 작업 2
        - [ ] 작업 3
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고사항
