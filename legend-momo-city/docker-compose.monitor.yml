services:
  loki:
    image: grafana/loki:latest
    container_name: momo-loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:latest
    container_name: momo-promtail
    ports:
      - "9080:9080"
    volumes:
      - ./docker/promtail/promtail-config.monitor.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: momo-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: momo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  cloudwatch-exporter:
    image: nerdswords/yet-another-cloudwatch-exporter:v0.60.0
    container_name: cloudwatch-exporter
    restart: unless-stopped
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_KEY}
    command: [ "--config.file=/tmp/config.yml" ]
    ports:
      - "5000:5000"
    volumes:
      - ./docker/cloudwatch-exporter/yace-config.yml:/tmp/config.yml

volumes:
  grafana_data:
  prometheus_data: